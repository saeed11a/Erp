name: Build HIKER Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - Apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check package.json
        run: |
          echo "===== PACKAGE.JSON ====="
          cat package.json
          echo "===== JSON VALIDATION ====="
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is VALID')"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Install Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Google OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          intent_filter = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.hiker.shoesfactory" android:host="login-callback" />
              </intent-filter>
          '''

          if 'android:scheme="com.hiker.shoesfactory"' in text:
              print("Google OAuth deep link already configured.")
          else:
              match = re.search(
                  r'<activity\b[^>]*MainActivity[^>]*>',
                  text,
                  re.IGNORECASE
              )

              if not match:
                  print("MainActivity declaration not found.")
                  print("===== ANDROID MANIFEST =====")
                  print(text)
                  raise SystemExit(1)

              insert_at = match.end()

              text = (
                  text[:insert_at]
                  + intent_filter
                  + text[insert_at:]
              )

              manifest.write_text(text)

              print("Google OAuth deep link configured.")

          print("===== FINAL ANDROID MANIFEST CHECK =====")
          print(manifest.read_text())
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set HIKER Android App Icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("public/hiker-logo.png")
          res = Path("android/app/src/main/res")

          if not source.exists():
              raise SystemExit("public/hiker-logo.png was not found.")

          for folder in ["mipmap-hdpi", "mipmap-mdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)

              shutil.copy2(source, target / "ic_launcher.png")
              shutil.copy2(source, target / "ic_launcher_round.png")

          print("HIKER app icon copied successfully.")
          PY

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hiker-erp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
