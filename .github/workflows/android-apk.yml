name: Build HIKER Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - Apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check package.json
        run: |
          echo "===== PACKAGE.JSON ====="
          cat package.json
          echo "===== JSON VALIDATION ====="
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is VALID')"

      - name: Install dependencies
        run: npm install
        
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Install Capacitor Android
        run: npx cap add android

      - name: Configure Google OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          marker = '<activity android:name=".MainActivity"'
          intent_filter = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.hiker.shoesfactory" android:host="login-callback" />
              </intent-filter>
          '''

          if intent_filter.strip() not in text:
              pos = text.find(marker)
              if pos == -1:
                  raise SystemExit("MainActivity not found in AndroidManifest.xml")

              end = text.find(">", pos)
              if end == -1:
                  raise SystemExit("Could not find MainActivity opening tag")

              end += 1
              text = text[:end] + intent_filter + text[end:]
              manifest.write_text(text)

          print("Google OAuth deep link configured.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hiker-erp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
